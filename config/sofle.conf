# Enable displays
CONFIG_ZMK_DISPLAY=y
# LVGL memory
CONFIG_LV_Z_MEM_POOL_SIZE=32768
# Unflip
CONFIG_NICE_VIEW_WIDGET_INVERTED=y
# Dedicated thread for display updates
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Disable fancy screen and use per-widget config
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y


# Disable RGB to resolve pin conflicts with nice!view
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enabled zmk-studio to access keyboard
CONFIG_ZMK_STUDIO=y
