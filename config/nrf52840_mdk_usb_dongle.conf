CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_ZMK_BLE=y

# Persist settings (BLE bonds etc.) to the storage partition at 0xCC000.
# Zephyr's board defconfig lacks these, unlike ZMK's nice_nano defconfig.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
